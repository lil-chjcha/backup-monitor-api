services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backup_monitor
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: backup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup -d backup_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://backup:backup@db:5432/backup_monitor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
